version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: nexus_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bd_contacto}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bd_contacto}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_network

  # Aplicación Backend & Frontend (Nexus Contactos)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_contactos_app
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:4000}
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bd_contacto}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-jwt_secreto_super_seguro_produccion_2026}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_SECURE: ${EMAIL_SECURE:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Sistema de Contactos <no-reply@dominio.com>}
    ports:
      - "4000:4000"
    networks:
      - nexus_network

networks:
  nexus_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
